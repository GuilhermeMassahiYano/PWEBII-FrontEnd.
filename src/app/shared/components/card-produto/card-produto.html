<div class="card" style="width: 18rem;">

  <img [src]="foto" class="imagem-card">

  <div class="card-body">

    <h5 class="card-title">
      {{nomeProduto | uppercase}}

      @if(promocao){
        <span class="badge text-bg-primary">Promoção</span>
      } @else {
        <span class="badge text-bg-primary">Aproveite</span>
      }
    </h5>

    <p class="card-text">
      Disponiveis: {{idProduto | number:'2.0-1'}}
    </p>

    <p>
      Nascimento: {{dataNascimento | date}}
    </p>

    <br>

    <a href="#" class="btn btn-primary float-end">
      {{precoProduto | currency:'BRL':'symbol':'1.2-2':'pt-BR'}}
    </a>

  </div>
</div>
